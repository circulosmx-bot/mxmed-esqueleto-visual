<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agenda publica | MXMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: #f4f6f9;
      color: #1f2937;
    }

    .page-wrap {
      max-width: 620px;
    }

    .day-card {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
    }

    .day-card .card-body {
      padding: 14px;
    }

    .day-title {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 10px;
      color: #111827;
      text-transform: capitalize;
    }

    .slot-chip {
      min-width: 96px;
      border-radius: 999px;
      font-weight: 600;
    }

    .week-controls {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #ffffff;
      padding: 10px;
    }
  </style>
</head>
<body>
  <main class="container py-3 py-md-4 page-wrap">
    <header class="mb-3">
      <h1 class="h3 mb-1">Agendar cita</h1>
      <p class="text-secondary mb-0">Selecciona un horario disponible</p>
    </header>

    <p id="summary" class="small text-secondary mb-3"></p>

    <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

    <div class="d-grid mb-3">
      <button id="toggleModeBtn" type="button" class="btn btn-primary">Ver mas fechas</button>
    </div>

    <div id="weekControls" class="week-controls d-none mb-3">
      <div class="d-flex align-items-center justify-content-between gap-2">
        <button id="prevWeekBtn" type="button" class="btn btn-outline-secondary btn-sm">Semana anterior</button>
        <span id="weekLabel" class="small text-secondary">Semana 0</span>
        <button id="nextWeekBtn" type="button" class="btn btn-outline-secondary btn-sm">Semana siguiente</button>
      </div>
    </div>

    <section id="loadingState" class="text-center py-5 d-none" aria-live="polite">
      <div class="spinner-border text-primary mb-2" role="status" aria-hidden="true"></div>
      <div>Cargando...</div>
    </section>

    <div id="emptyState" class="alert alert-light border d-none">No hay disponibilidad</div>

    <section id="daysContainer" class="vstack gap-3"></section>
  </main>

  <div class="modal fade" id="slotModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title fs-5">Confirmar cita</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2"><strong>Fecha y hora:</strong> <span id="modalDateTime">-</span></p>
          <p class="mb-2"><strong>doctor_id:</strong> <span id="modalDoctorId">-</span></p>
          <p class="mb-3"><strong>consultorio_id:</strong> <span id="modalConsultorioId">-</span></p>

          <div id="modalAlert" class="alert d-none" role="alert"></div>

          <form id="appointmentRequestForm" class="vstack gap-2">
            <div>
              <label for="patientNameInput" class="form-label">Nombre completo</label>
              <input id="patientNameInput" class="form-control" type="text" maxlength="160" required />
            </div>
            <div>
              <label for="patientPhoneInput" class="form-label">Telefono</label>
              <input id="patientPhoneInput" class="form-control" type="tel" maxlength="32" placeholder="Opcional" />
            </div>
            <div>
              <label for="patientEmailInput" class="form-label">Correo</label>
              <input id="patientEmailInput" class="form-control" type="email" maxlength="191" placeholder="Opcional" />
            </div>
            <div class="form-text">Ingresa telefono o correo para recibir el codigo.</div>
            <button id="sendOtpBtn" type="submit" class="btn btn-primary w-100">Enviar codigo</button>
          </form>

          <section id="otpStep" class="d-none mt-3">
            <hr />
            <div>
              <label for="otpInput" class="form-label">Codigo OTP (6 digitos)</label>
              <input id="otpInput" class="form-control" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" />
            </div>
            <div id="otpDebugHint" class="small text-secondary mt-2 d-none"></div>
            <button id="confirmOtpBtn" type="button" class="btn btn-success w-100 mt-2">Confirmar cita</button>
          </section>

          <section id="successStep" class="d-none mt-3">
            <hr />
            <div class="alert alert-success mb-2">Cita confirmada.</div>
            <p class="mb-0 small">appointment_id: <strong id="successAppointmentId">-</strong></p>
          </section>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script defer src="assets/js/public/agenda-publica.js"></script>
</body>
</html>
