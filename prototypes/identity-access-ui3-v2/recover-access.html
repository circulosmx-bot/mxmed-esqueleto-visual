<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Recupera tu acceso · Prototipo UI-3</title>
  <link rel="stylesheet" href="prototype.css">
</head>
<body data-flow="recover">
  <div class="prototype-shell">
    <header class="prototype-header"><a class="prototype-brand" href="index.html" aria-label="México Médico · inicio del prototipo"><img src="../../../assets/mexico-medico.svg" alt="México Médico"></a><span class="prototype-badge">Prototipo UI-3</span></header>
    <main class="prototype-main">
      <section class="prototype-card auth-card" aria-labelledby="recover-title">
        <p class="auth-card__eyebrow">Identidad y acceso</p>
        <h1 id="recover-title">Recupera tu acceso</h1>
        <p class="auth-card__intro">Ingresa tu correo y te enviaremos instrucciones si existe una cuenta asociada.</p>
        <div class="state-panel" data-state-panel aria-live="polite"><strong data-state-title></strong><span data-state-copy></span></div>
        <form class="auth-form" data-prototype-form>
          <div class="field"><label for="recover-email">Correo electrónico</label><input id="recover-email" name="email" type="email" autocomplete="email" required></div>
          <div class="form-actions"><button class="button" type="submit" data-submit>Enviar instrucciones</button></div>
          <p class="auth-links" data-form-note aria-live="polite"><a href="login.html">Volver a iniciar sesión</a></p>
        </form>
      </section>
    </main>
    <footer class="prototype-footer"><a href="index.html">Volver al índice del prototipo</a></footer>
  </div>
  <script src="prototype.js"></script>
</body>
</html>
