<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Captura clínica móvil</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1f2937;background:#f6f8fb}
    body{margin:0;padding:20px}
    .wrap{max-width:560px;margin:0 auto;background:#fff;border:1px solid #dbe3ef;border-radius:14px;padding:18px;box-shadow:0 6px 18px rgba(17,24,39,.08)}
    h1{margin:0 0 8px;font-size:1.2rem}
    p{margin:0 0 14px;color:#4b5563}
    label{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
    input[type="file"],input[type="text"],input[type="datetime-local"]{width:100%;box-sizing:border-box;border:1px solid #c7d2e5;border-radius:10px;padding:10px;font-size:.95rem;margin-bottom:12px}
    button{border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;width:100%}
    button[disabled]{opacity:.6;cursor:not-allowed}
    .btn-secondary{border-color:#64748b;background:#fff;color:#334155}
    .msg{margin-top:12px;font-size:.92rem}
    .ok{color:#15803d}
    .err{color:#b91c1c}
    .muted{color:#6b7280}
    .preview{margin-top:10px;display:none}
    .preview img{width:100%;max-height:260px;object-fit:contain;border:1px solid #dbe3ef;border-radius:10px;background:#f8fafc}
    .d-none{display:none !important}
    .pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .capture-type{padding:12px;border-radius:8px;background:#dbfcff;color:#07536e;font-weight:600}
    .file-name{font-size:13px;overflow-wrap:anywhere}
    #captureSubmit{background:#00aebe;border-color:#00aebe;min-height:44px}
    .pickers button{min-height:48px;color:#07536e;border-color:#00b8c9;background:#fff}
    .wrap{color:#07536e;border-color:#bdd8e4}
    [hidden]{display:none!important}
    .sig-pad{border:1px solid #c7d2e5;border-radius:10px;background:#fff;touch-action:none;width:100%;height:190px}
    .sig-actions{display:flex;gap:10px;margin-top:10px}
    .sig-actions button{width:auto;flex:1}
    .consent-review-frame{width:100%;height:min(58vh,560px);border:1px solid #c7d2e5;border-radius:10px;background:#fff}
    .consent-review-frame.interconsulta-review-frame{height:min(76vh,720px)}
    .consent-signer{padding:10px 12px;border-radius:8px;background:#e9f7fa;font-weight:700;margin:10px 0}
  </style>
</head>
<body>
  <main class="wrap">
    <h1 id="captureTitle">Capturar documento</h1>
    <p id="captureIntro">Fotografía o selecciona el documento y envíalo a la consulta abierta en tu computadora.</p>

    <p class="capture-type" id="captureClassification" hidden></p>
    <form id="captureForm">
      <div class="pickers"><button type="button" id="captureTakePhoto" disabled>Tomar foto</button><button type="button" id="captureChooseFile" disabled>Seleccionar imagen/archivo</button></div>
      <input id="captureFile" name="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" aria-label="Seleccionar imagen o archivo" hidden>
      <input id="captureCamera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" aria-label="Tomar foto" hidden>
      <p class="file-name" id="captureFileName" aria-live="polite"></p>
      <p id="captureMaxSize">Tamaño máximo: 25 MB</p>
      <div id="captureLegacyMetadata">

      <label for="captureSummary">Resumen (opcional)</label>
      <input id="captureSummary" name="summary" type="text" maxlength="180" placeholder="Ej. Foto de lesión en control">

      <label for="captureDatetime">Fecha y hora (opcional)</label>
      <input id="captureDatetime" name="event_datetime" type="datetime-local">

      </div>
      <button id="captureSubmit" type="submit" disabled>Enviar documento</button>
    </form>

    <section id="consentReview" class="d-none">
      <h2 style="font-size:1.05rem">Revisa el consentimiento</h2>
      <p id="consentSigner" class="consent-signer"></p>
      <iframe id="consentReviewFrame" class="consent-review-frame" title="Consentimiento que se firmará"
        sandbox="" referrerpolicy="no-referrer"></iframe>
      <p>Declaro que he revisado la información mostrada.</p>
      <button type="button" id="consentContinue">Continuar a firma</button>
    </section>

    <form id="signatureForm" class="d-none">
      <p id="signatureRole" class="consent-signer"></p>

      <label for="signatureCanvas">Firma en pantalla</label>
      <canvas id="signatureCanvas" class="sig-pad" width="520" height="190" aria-label="Firma del paciente o representante"></canvas>

      <div class="sig-actions">
        <button type="button" class="btn-secondary" id="signatureClear">Limpiar firma</button>
        <button type="submit" id="signatureSubmit">Enviar firma</button>
      </div>
    </form>

    <div class="preview" id="capturePreviewWrap">
      <img id="capturePreview" alt="Vista previa de imagen">
    </div>

    <div class="msg muted" id="captureMsg" role="status" aria-live="polite">Esperando acción…</div>
  </main>

  <script src="/public/mobile-capture-session.js?v=r43a"></script>
  <script src="/assets/js/clinical/consent-signature-binding.js"></script>
  <script>
    (function(){
      const params = new URLSearchParams(window.location.search || '');
      const token = String(params.get('token') || '').trim();
      const mode = String(params.get('mode') || '').trim().toLowerCase();
      if (mode === 'multipage') { window.startClinicalMultipageCapture(token); return; }

      const titleEl = document.getElementById('captureTitle');
      const introEl = document.getElementById('captureIntro');
      const form = document.getElementById('captureForm');
      const fileInput = document.getElementById('captureFile');
      const summaryInput = document.getElementById('captureSummary');
      const datetimeInput = document.getElementById('captureDatetime');
      const submitBtn = document.getElementById('captureSubmit');
      const cameraInput=document.getElementById('captureCamera'),takePhoto=document.getElementById('captureTakePhoto'),chooseFile=document.getElementById('captureChooseFile');
      // Matches ClinicalPrivateBinaryStorage::MAX_BYTES; server validation remains authoritative.
      const maxClinicalUploadBytes = 25 * 1024 * 1024;
      let selectedFile=null,previewUrl='',pending=false,scopedClassification=false,acceptedTypes=['image/jpeg','image/png','image/webp','application/pdf'];
      takePhoto.onclick=()=>cameraInput.click();chooseFile.onclick=()=>fileInput.click();
      const previewWrap = document.getElementById('capturePreviewWrap');
      const previewImg = document.getElementById('capturePreview');

      const signatureForm = document.getElementById('signatureForm');
      const signatureCanvas = document.getElementById('signatureCanvas');
      const consentReview = document.getElementById('consentReview');
      const consentReviewFrame = document.getElementById('consentReviewFrame');
      const consentSigner = document.getElementById('consentSigner');
      const consentContinue = document.getElementById('consentContinue');
      const signatureRole = document.getElementById('signatureRole');
      const signatureSubmit = document.getElementById('signatureSubmit');
      const signatureClear = document.getElementById('signatureClear');

      const msg = document.getElementById('captureMsg');

      const isResponsivaSignature = mode === 'responsiva-signature';
      const isCertificadoSignature = mode === 'certificado-signature';
      const isInterconsultaSignature = mode === 'interconsulta-signature';
      const isInformeSignature = mode === 'informe-signature';
      const isSignatureMode = mode === 'signature' || isResponsivaSignature || isCertificadoSignature || isInterconsultaSignature || isInformeSignature;
      const signatureRoute = isInformeSignature ? 'informe-qr-sessions'
        : isInterconsultaSignature ? 'interconsulta-qr-sessions'
        : isCertificadoSignature ? 'certificado-qr-sessions'
        : (isResponsivaSignature ? 'responsiva-qr-sessions' : 'note-capture-tokens');
      const signatureDocument = isInformeSignature ? 'el informe' : isInterconsultaSignature ? 'la interconsulta' : isCertificadoSignature ? 'el certificado'
        : (isResponsivaSignature ? 'la responsiva' : 'el consentimiento');
      const signatureObjectPronoun = isResponsivaSignature || isInterconsultaSignature ? 'firmarla' : 'firmarlo';
      let signatureHasStroke = false;

      const setMsg = (text, tone='muted')=>{
        msg.textContent = String(text || '');
        msg.classList.remove('muted', 'ok', 'err');
        msg.classList.add(tone === 'ok' ? 'ok' : (tone === 'err' ? 'err' : 'muted'));
      };
      const safeError = (error, fallback)=>{
        const value=String(error?.message || '').trim();
        return /^(Failed to fetch|NetworkError|Load failed|HTTP \d+)$/i.test(value)
          ? 'No se pudo conectar. Revisa tu conexión e intenta de nuevo.'
          : (value || fallback);
      };

      const setNowDatetime = ()=>{
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const mi = String(now.getMinutes()).padStart(2, '0');
        datetimeInput.value = `${yyyy}-${mm}-${dd}T${hh}:${mi}`;
      };

      const isImageLike = (file)=>{
        const type = String(file?.type || '').toLowerCase();
        const name = String(file?.name || '').toLowerCase();
        return type.startsWith('image/') || /\.(png|jpe?g|webp|gif|bmp|heic|heif)$/i.test(name);
      };

      const maybeOptimizeImageForUpload = async (file)=>{
        if(!file || !isImageLike(file)) return file;
        const maxBytesWithoutProcessing = 3 * 1024 * 1024;
        if((Number(file.size) || 0) <= maxBytesWithoutProcessing){
          return file;
        }
        try{
          const objectUrl = URL.createObjectURL(file);
          const image = await new Promise((resolve, reject)=>{
            const img = new Image();
            img.onload = ()=> resolve(img);
            img.onerror = reject;
            img.src = objectUrl;
          });
          const maxDim = 1800;
          const scale = Math.min(1, maxDim / Math.max(image.width || 1, image.height || 1));
          const targetW = Math.max(1, Math.round((image.width || 1) * scale));
          const targetH = Math.max(1, Math.round((image.height || 1) * scale));
          const canvas = document.createElement('canvas');
          canvas.width = targetW;
          canvas.height = targetH;
          const ctx = canvas.getContext('2d');
          if(!ctx){
            URL.revokeObjectURL(objectUrl);
            return file;
          }
          ctx.drawImage(image, 0, 0, targetW, targetH);
          URL.revokeObjectURL(objectUrl);
          const blob = await new Promise((resolve)=>{
            canvas.toBlob((result)=> resolve(result), 'image/jpeg', 0.82);
          });
          if(!blob || blob.size <= 0){
            return file;
          }
          const originalName = String(file.name || 'capture.jpg');
          const sanitized = originalName.replace(/\.[^.]+$/, '');
          const finalName = `${sanitized || 'capture'}-mobile.jpg`;
          return new File([blob], finalName, { type: 'image/jpeg' });
        }catch(_){
          return file;
        }
      };

      const setupSignatureCanvas = ()=>{
        if(!signatureCanvas) return;
        const ctx = signatureCanvas.getContext('2d');
        if(!ctx) return;
        const reset = ()=>{
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, signatureCanvas.width, signatureCanvas.height);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = 2;
          ctx.strokeStyle = '#0f172a';
          signatureHasStroke = false;
        };
        reset();
        let drawing = false;
        const point = (event)=>{
          const rect = signatureCanvas.getBoundingClientRect();
          return {
            x: (event.clientX - rect.left) * (signatureCanvas.width / Math.max(1, rect.width)),
            y: (event.clientY - rect.top) * (signatureCanvas.height / Math.max(1, rect.height))
          };
        };
        const start = (event)=>{
          drawing = true;
          const p = point(event);
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          signatureHasStroke = true;
          event.preventDefault();
        };
        const move = (event)=>{
          if(!drawing) return;
          const p = point(event);
          ctx.lineTo(p.x, p.y);
          ctx.stroke();
          event.preventDefault();
        };
        const end = (event)=>{
          if(!drawing) return;
          drawing = false;
          ctx.closePath();
          event.preventDefault();
        };
        signatureCanvas.addEventListener('pointerdown', start);
        signatureCanvas.addEventListener('pointermove', move);
        signatureCanvas.addEventListener('pointerup', end);
        signatureCanvas.addEventListener('pointercancel', end);
        signatureCanvas.addEventListener('pointerleave', end);
        signatureClear?.addEventListener('click', (event)=>{
          event.preventDefault();
          reset();
          setMsg('Firma limpiada. Dibuja nuevamente para enviar.', 'muted');
        });
      };

      if(!token){
        setMsg('Token inválido o ausente. Abre este enlace desde el QR del escritorio.', 'err');
        submitBtn.disabled = true;
        if(signatureSubmit) signatureSubmit.disabled = true;
      }

      if(isSignatureMode){
        if ((isResponsivaSignature || isCertificadoSignature || isInterconsultaSignature || isInformeSignature) && (!window.isSecureContext || !window.crypto?.subtle?.digest)) {
          setMsg(`Abre el enlace HTTPS seguro para revisar y firmar ${signatureDocument}.`, 'err');
          return;
        }
        titleEl.textContent = isInformeSignature ? 'Informe médico' : isInterconsultaSignature ? 'Interconsulta' : isCertificadoSignature ? 'Certificado médico'
          : (isResponsivaSignature ? 'Responsiva médica' : 'Consentimiento informado');
        introEl.textContent = 'Revisa el documento antes de firmar esta versión.';
        consentReview.querySelector('h2').textContent = isInformeSignature ? 'Revisar informe médico' : isInterconsultaSignature ? 'Revisar interconsulta' : isCertificadoSignature ? 'Revisar certificado'
          : (isResponsivaSignature ? 'Revisar responsiva' : 'Revisa el consentimiento');
        consentReviewFrame.title = isInformeSignature ? 'Informe médico que se firmará' : isInterconsultaSignature ? 'Interconsulta que se firmará' : isCertificadoSignature ? 'Certificado que se firmará'
          : (isResponsivaSignature ? 'Responsiva que se firmará' : 'Consentimiento que se firmará');
        consentReviewFrame.classList.toggle('interconsulta-review-frame', isInterconsultaSignature || isInformeSignature);
        form.classList.add('d-none');
        previewWrap.style.display = 'none';
        setupSignatureCanvas();
        if(token){
          setMsg(`Cargando ${signatureDocument}…`, 'muted');
          fetch(`/api/clinical/index.php/${signatureRoute}/${encodeURIComponent(token)}/mobile-context`,
            {headers:{Accept:'application/json'},credentials:'omit',cache:'no-store'})
            .then(async response=>{
              const json=await response.json().catch(()=>null);
              if(!response.ok || !json?.ok) throw new Error(json?.message || 'Este QR ya no está disponible. Solicita uno nuevo.');
              return json.data;
            })
            .then(data=>{
              if(data.status!=='pending') throw new Error('Este QR ya fue utilizado o expiró. Solicita uno nuevo.');
              const interconsultaMobileStyle = (isInterconsultaSignature || isInformeSignature)
                ? `<meta name="viewport" content="width=device-width, initial-scale=1"><style>
                    html,body{margin:0;max-width:100%;overflow-x:hidden}
                    .interconsulta-doc-sheet,.informe-doc-sheet{width:100% !important;min-height:0 !important;padding:16px !important;box-shadow:none !important}
                    .interconsulta-doc-sheet *,.informe-doc-sheet *{box-sizing:border-box;max-width:100%;overflow-wrap:anywhere}
                    .interconsulta-doc-sheet .doc-base-footer-block,.informe-doc-sheet .doc-base-footer-block{transform:none}
                  </style>` : '';
              consentReviewFrame.srcdoc=(isResponsivaSignature || isCertificadoSignature || isInterconsultaSignature || isInformeSignature)
                ? `<link rel="stylesheet" href="/assets/css/clinical-doc-base.css"><link rel="stylesheet" href="/assets/css/clinical/responsiva-document.css">${interconsultaMobileStyle}${String(data.review_html || '')}`
                : String(data.review_html || '');
              consentSigner.textContent=`${data.role_label}: ${data.signer_name || 'Médico responsable'}`;
              signatureRole.textContent=consentSigner.textContent;
              consentReview.classList.remove('d-none');
              setMsg(`Lee ${signatureDocument} y continúa para ${signatureObjectPronoun}.`, 'muted');
            }).catch(error=>setMsg(safeError(error,`No se pudo cargar ${signatureDocument}.`), 'err'));
        }
      }else if(token){
        setNowDatetime();setMsg('Verificando código…');
        fetch(`/api/clinical/index.php/note-capture-tokens/${encodeURIComponent(token)}/mobile-context`,{headers:{Accept:'application/json'},credentials:'omit',cache:'no-store'})
          .then(async response=>{const json=await response.json();if(!response.ok||!json.ok)throw new Error('El código no está disponible. Solicita uno nuevo en tu computadora.');return json.data;})
          .then(data=>{
            pending=data.status==='pending';scopedClassification=!!data.classification?.id;
            acceptedTypes=data.classification?.mime_types||acceptedTypes;fileInput.accept=acceptedTypes.join(',');
            const label=document.getElementById('captureClassification');label.textContent='Documento: '+data.classification.label;label.hidden=false;
            document.getElementById('captureLegacyMetadata').hidden=scopedClassification;
            takePhoto.hidden=!acceptedTypes.some(type=>type.startsWith('image/'));takePhoto.disabled=!pending;chooseFile.disabled=!pending;
            chooseFile.textContent=acceptedTypes.includes('application/pdf')&&!acceptedTypes.some(type=>type.startsWith('image/'))?'Seleccionar archivo PDF':'Seleccionar imagen/archivo';
            setMsg(pending?'Selecciona el documento. Se enviará sólo cuando presiones Enviar documento.':({expired:'El código expiró. Genera uno nuevo en tu computadora.',cancelled:'Este código fue cancelado.',uploaded:'Documento recibido. Este código ya fue utilizado.',consumed:'Documento recibido. Este código ya fue utilizado.'})[data.status]||'Este código ya no está disponible.',pending?'muted':'err');
          }).catch(error=>setMsg(error.message,'err'));
      }

      consentContinue?.addEventListener('click',async()=>{
        consentContinue.disabled=true;
        setMsg('Confirmando revisión…', 'muted');
        try{
          const response=await fetch(`/api/clinical/index.php/${signatureRoute}/${encodeURIComponent(token)}/review`,
            {method:'POST',headers:{Accept:'application/json'},credentials:'omit'});
          const json=await response.json().catch(()=>null);
          if(!response.ok || !json?.ok) throw new Error(json?.message || 'No se pudo confirmar la revisión.');
          consentReview.classList.add('d-none');
          signatureForm.classList.remove('d-none');
          setMsg(`Firma ${signatureDocument} ${isResponsivaSignature || isInterconsultaSignature ? 'mostrada' : 'mostrado'} y confirma.`, 'muted');
        }catch(error){
          consentContinue.disabled=false;
          setMsg(safeError(error,'No se pudo continuar a la firma.'), 'err');
        }
      });

      const selectFile=input=>{
        const file=input.files?.[0]||null;
        if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl='';}previewImg.removeAttribute('src');previewWrap.style.display='none';
        selectedFile=null;submitBtn.disabled=true;document.getElementById('captureFileName').textContent='';
        if(!pending||!file)return;
        if(file.size>maxClinicalUploadBytes){setMsg('Este archivo supera el límite de 25 MB. Elige otra foto o reduce su tamaño.','err');input.value='';return;}
        if(!acceptedTypes.includes(file.type)){setMsg('El archivo no corresponde al tipo elegido en la computadora.','err');input.value='';return;}
        selectedFile=file;document.getElementById('captureFileName').textContent=file.name;submitBtn.disabled=false;
        if(file.type.startsWith('image/')){previewUrl=URL.createObjectURL(file);previewImg.src=previewUrl;previewWrap.style.display='block';}
        setMsg('Documento seleccionado. Revisa y presiona Enviar documento.');
      };
      fileInput.addEventListener('change',()=>selectFile(fileInput));cameraInput.addEventListener('change',()=>selectFile(cameraInput));
      window.addEventListener('pagehide',()=>{if(previewUrl)URL.revokeObjectURL(previewUrl);});

      form?.addEventListener('submit', async (event)=>{
        event.preventDefault();
        const file = selectedFile;
        if(!pending)return;
        if(!file){
          setMsg('Selecciona un archivo antes de subir.', 'err');
          return;
        }
        submitBtn.disabled = true;
        setMsg('Preparando imagen…');
        try{
          const uploadFile = await maybeOptimizeImageForUpload(file);
          const formData = new FormData();
          formData.append('file', uploadFile);
          const summary = String(summaryInput.value || '').trim();
          const eventDatetime = String(datetimeInput.value || '').trim();
          if(!scopedClassification&&summary) formData.append('summary', summary);
          if(!scopedClassification&&eventDatetime) formData.append('event_datetime', eventDatetime);

          setMsg('Enviando documento…');
          const resp = await fetch(`/api/clinical/index.php/note-capture-tokens/${encodeURIComponent(token)}/upload`, {
            method: 'POST',
            body: formData,
            headers: { Accept: 'application/json' },
            credentials: 'same-origin'
          });
          const json = await resp.json().catch(()=> null);
          if(!resp.ok || !json || json.ok !== true){
            const message = String((json && (json.message || (json.error && json.error.message) || json.error)) || `HTTP ${resp.status}`).trim();
            throw new Error(message || 'No se pudo subir la imagen.');
          }
          setMsg('Documento enviado correctamente. Ya puedes volver a tu computadora.', 'ok');
          pending=false;cameraInput.disabled=true;takePhoto.disabled=true;chooseFile.disabled=true;
          submitBtn.disabled = true;
          fileInput.disabled = true;
          summaryInput.disabled = true;
          datetimeInput.disabled = true;
        }catch(error){
          setMsg(String((error && error.message) || 'No se pudo subir la imagen.'), 'err');
          submitBtn.disabled = false;
        }
      });

      signatureForm?.addEventListener('submit', async (event)=>{
        event.preventDefault();
        if(!signatureHasStroke || !window.mxmedConsentSignatureBinding?.hasInk(signatureCanvas)){
          setMsg('Dibuja una firma legible antes de confirmar.', 'err');
          return;
        }
        const signatureData = signatureCanvas.toDataURL('image/png');
        signatureSubmit.disabled = true;
        setMsg('Enviando firma…', 'muted');
        try{
          const resp = await fetch(`/api/clinical/index.php/${signatureRoute}/${encodeURIComponent(token)}/signature`, {
            method: 'POST',
            headers: {
              Accept: 'application/json',
              'Content-Type': 'application/json'
            },
            credentials: 'same-origin',
            body: JSON.stringify({
              signature_data: signatureData,
              reviewed: true
            })
          });
          const json = await resp.json().catch(()=> null);
          if(!resp.ok || !json || json.ok !== true){
            const message = String((json && (json.message || (json.error && json.error.message) || json.error)) || `HTTP ${resp.status}`).trim();
            throw new Error(message || 'No se pudo enviar la firma.');
          }
          setMsg('Firma recibida correctamente. Ya puedes volver a tu computadora.', 'ok');
          signatureSubmit.disabled = true;
          signatureCanvas.style.pointerEvents = 'none';
          signatureClear.disabled = true;
        }catch(error){
          setMsg(safeError(error,'No se pudo enviar la firma.'), 'err');
          signatureSubmit.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
