<Directory />
    AllowOverride None
    Options -Indexes -FollowSymLinks
    Require all denied
</Directory>

<Directory /var/www/html>
    AllowOverride FileInfo Options
    Options -Indexes -FollowSymLinks
    Require all granted
</Directory>

<Directory /var/www/health>
    AllowOverride None
    Options -Indexes -FollowSymLinks
    Require all granted
</Directory>

<FilesMatch "(^\.|composer\.(json|lock)$|.*\.(sql|dump|bak|log|env)$)">
    Require all denied
</FilesMatch>
