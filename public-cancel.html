<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cancelar cita publica | MXMed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f5f7fb; }
    .wrap { max-width: 560px; }
    .card-main { border-radius: 16px; }
    .btn-main { padding-top: 12px; padding-bottom: 12px; font-weight: 700; }
  </style>
</head>
<body>
  <main class="container py-4 wrap">
    <article class="card card-main shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Cancelar cita</h1>
        <p class="text-secondary mb-3">Ingresa el token de cancelacion para liberar tu horario.</p>

        <div id="alertBox" class="alert d-none" role="alert"></div>

        <form id="cancelForm" class="vstack gap-2">
          <label for="tokenInput" class="form-label mb-0">Cancel token</label>
          <input id="tokenInput" class="form-control" type="text" autocomplete="off" required />

          <label for="reasonInput" class="form-label mb-0 mt-2">Motivo (opcional)</label>
          <textarea id="reasonInput" class="form-control" rows="3" maxlength="280"></textarea>

          <button id="cancelBtn" type="submit" class="btn btn-danger btn-main mt-2">Cancelar cita</button>
        </form>
      </div>
    </article>
  </main>

  <script defer src="assets/js/public/agenda-cancel.js"></script>
</body>
</html>
